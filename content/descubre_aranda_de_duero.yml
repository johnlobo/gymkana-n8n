  capsula: |-
    🏁 *FIN DE LA VISITA · ARANDA DE DUERO*

    Habéis llegado al Duero, el río que terminó formando parte del nombre de la ciudad y que da identidad a toda una comarca.

    🌊 *Tres ríos*

    Durante el recorrido hemos cruzado o mencionado tres cursos de agua estrechamente relacionados con Aranda: el Bañuelos, el Arandilla y el Duero.

    Los ríos fueron recursos imprescindibles, pero también barreras que obligaron a construir puentes y condicionaron el crecimiento urbano.

    🌉 *El Puente Mayor*

    Este paso sobre el Duero fue durante siglos uno de los principales accesos a la población desde el sur.

    Viajeros, comerciantes, campesinos, ejércitos y mercancías debían atravesar el río para entrar en la villa.

    Como ocurre con muchos puentes históricos, su aspecto actual es el resultado de sucesivas reparaciones y transformaciones. Crecidas, nuevos medios de transporte y mayores necesidades de circulación obligaron a modificarlo con el paso del tiempo.

    🍷 *Duero y vino*

    El río nos permite cerrar también el otro gran tema de la visita.

    Aranda es una de las principales poblaciones de la Ribera del Duero, una comarca donde la viticultura ha modelado la economía, el paisaje y la cultura durante siglos.

    Las bodegas medievales que habéis descubierto bajo el casco histórico son el antecedente de una tradición que continúa hoy en las bodegas y viñedos de toda la región.

    🧭 *Lo que hemos recorrido*

    En apenas unos minutos a pie habéis encontrado diferentes capas de la historia de Aranda:

    ⛪ Santa María mostró el crecimiento y la prosperidad de la villa.

    🍷 Las bodegas revelaron una segunda ciudad bajo tierra.

    🏘️ La Plaza Mayor explicó la vida pública, comercial y administrativa.

    🏰 El Palacio de los Berdugo mostró el poder de las familias nobles.

    ⛪ San Juan nos llevó hasta la Aranda medieval y el Concilio de 1473.

    🌉 Las Tenerías recordaron la importancia de los oficios y de los pequeños ríos.

    🌊 Y finalmente el Duero conecta todo lo anterior con el territorio y con la cultura del vino.

    La visita termina aquí, pero Aranda tiene todavía otros museos, bodegas, parques, espacios gastronómicos y rincones que merece la pena descubrir.

    🍷 Y si todavía no lo habéis hecho, probablemente ha llegado el momento de conocer otra parte esencial de la Ribera del Duero: su vino y su gastronomía.

    *Gracias por recorrer Aranda con nosotros.*
