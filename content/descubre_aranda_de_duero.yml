  capsula: |-
    🏛️ *IGLESIA DE SANTA MARÍA LA REAL*

    La iglesia que tenéis delante es uno de los grandes monumentos de Aranda de Duero y una de las obras más representativas del gótico tardío burgalés.

    El edificio actual sustituyó a un templo anterior. De aquella construcción primitiva se conserva la torre, concebida con un marcado carácter defensivo. No era extraño en la Edad Media que un edificio religioso situado cerca de las murallas pudiera cumplir también funciones de vigilancia y protección.

    Las obras del nuevo templo ya estaban en marcha en el siglo XV. El crecimiento de Aranda exigía una iglesia de mayor tamaño y prestigio, y el resultado fue un edificio gótico de amplias proporciones, organizado en varias naves y capillas.

    ⭐ *La gran protagonista: la fachada*

    Lo más espectacular es precisamente lo que acabáis de observar. La portada se concibió como un gigantesco retablo de piedra. Su ejecución se relaciona con Simón y Francisco de Colonia y quedó terminada a comienzos del siglo XVI.

    La fachada está dedicada a la Virgen y contiene decenas de figuras, relieves, escudos y escenas religiosas. En ella aparecen episodios del Nacimiento de Jesús, la Epifanía y la Pasión de Cristo, además de santos, apóstoles y evangelistas.

    En el centro, la imagen de María con el Niño que habéis localizado preside todo el conjunto.

    👑 *Reyes en la piedra*

    También podéis encontrar grandes escudos vinculados a la monarquía. La decoración de Santa María recuerda la estrecha relación de Aranda con la Corona en tiempos de los Reyes Católicos y sus sucesores.

    🎨 *Una fachada que tuvo color*

    Aunque hoy vemos fundamentalmente el tono natural de la piedra, la fachada estuvo policromada. Algunos rincones protegidos conservan todavía restos que permiten imaginar un aspecto mucho más colorido que el actual.

    Si la iglesia está abierta, el interior merece una visita; sin embargo, nuestra ruta no depende de horarios ni de comprar ninguna entrada.
