    ⛪ *IGLESIA DE SAN JUAN BAUTISTA*

    Ya conocéis una palabra nueva: *arquivolta*.

    La portada que acabáis de observar tiene nueve y constituye uno de los elementos más llamativos de este templo.

    San Juan es además esencial para comprender la evolución histórica de Aranda porque conserva elementos anteriores a Santa María y estuvo estrechamente vinculada al sistema defensivo medieval.

    🛡️ *Una iglesia que también defendía*

    La torre es uno de los elementos más antiguos del conjunto y se relaciona con el siglo XIII.

    Su aspecto sólido no es casual. La proximidad a la antigua muralla permitía que el edificio cumpliera funciones defensivas además de religiosas.

    Durante la Edad Media no siempre existía una separación clara entre arquitectura militar y religiosa.

    ⛪ *El templo gótico*

    La iglesia fue ampliándose y adquiriendo su configuración gótica durante los siglos siguientes.

    En la portada sur, las nueve arquivoltas crean el profundo acceso que habéis contado. En el tímpano aparece representado San Juan Bautista, titular del templo.

    📜 *1473: el Concilio de Aranda*

    En esta iglesia tuvo lugar uno de los episodios históricos más importantes de la ciudad: el *Concilio de Aranda de 1473*.

    La reunión buscó impulsar reformas en la Iglesia castellana en un periodo complejo, pocos años antes de la llegada al trono de Isabel de Castilla.

    La celebración del concilio demuestra que Aranda no era únicamente un centro comercial local. Tenía suficiente importancia y capacidad para acoger reuniones de gran relevancia política y eclesiástica.

    🖼️ *Museo de Arte Sacro*

    Actualmente el interior alberga el Museo de Arte Sacro.

    Sus colecciones reúnen pintura, escultura, orfebrería, textiles y otros objetos procedentes de iglesias de Aranda y de la Ribera del Duero.

    Una curiosidad conecta esta parada con el inicio de la ruta: algunas piezas originales retiradas de Santa María para protegerlas se conservan aquí.

    🏙️ *Dos iglesias, dos momentos*

    San Juan y Santa María se encuentran muy próximas, pero representan etapas diferentes de la ciudad.

    San Juan conserva la memoria de una Aranda medieval más defensiva.

    Santa María refleja el crecimiento y la prosperidad que permitieron levantar, unas generaciones después, un templo mucho más monumental.
