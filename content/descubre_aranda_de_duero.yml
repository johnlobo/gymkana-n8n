    🏘️ *LA PLAZA MAYOR Y EL CORAZÓN DE LA VILLA*

    Las plazas mayores españolas no fueron creadas únicamente para embellecer las ciudades. Durante siglos fueron escenarios de mercado, celebraciones, justicia, anuncios públicos, fiestas y vida política.

    La Plaza Mayor de Aranda fue desarrollándose desde época medieval como uno de los principales espacios colectivos de la villa. El crecimiento urbano terminó convirtiéndola en un verdadero centro administrativo y comercial.

    🏛️ *El Ayuntamiento*

    Uno de los edificios esenciales del entorno es el Ayuntamiento. Su presencia resume el papel que las plazas mayores adquirieron como representación del poder municipal.

    Desde este punto se gobernaba una villa situada en una posición estratégica: en la ruta entre el centro de Castilla y el norte peninsular y junto a varios cursos de agua.

    🛍️ *Mercados y comercio*

    Aranda funcionó durante siglos como centro de una extensa comarca agrícola y vitivinícola.

    Campesinos, artesanos, comerciantes y transportistas acudían a la villa para vender productos, adquirir mercancías, resolver asuntos administrativos o participar en ferias y celebraciones.

    Las calles que parten de la plaza mantienen todavía esa función comercial.

    🍷 *Arriba y abajo*

    Después de conocer las bodegas resulta más fácil imaginar el casco histórico de otra manera.

    Sobre la superficie se desarrollaba la vida cotidiana: casas, tiendas, templos y mercados.

    Bajo ella se almacenaba una de las principales riquezas locales: el vino.

    Las bodegas subterráneas no eran un elemento aislado. Formaban parte del funcionamiento normal de la ciudad.

    🗺️ *Un centro para orientarse*

    La Plaza Mayor es también un buen punto para comprender las pequeñas dimensiones del casco histórico.

    Santa María, San Juan, el Palacio de los Berdugo, las bodegas y los puentes están a pocos minutos caminando.

    La siguiente parada nos mostrará cómo las familias poderosas trasladaban su posición social a la propia arquitectura.
