  capsula: |-
    🍷 *LA CIUDAD SUBTERRÁNEA*

    Esta es probablemente la característica más singular de Aranda de Duero.

    Bajo buena parte del casco histórico existe una enorme red de bodegas excavadas para producir, criar y conservar vino. Las galerías suman aproximadamente *7 kilómetros* y algunas alcanzan profundidades cercanas a los *10-12 metros*.

    Muchas comenzaron a excavarse durante la Edad Media y fueron ampliándose a medida que aumentaba la importancia de la viticultura.

    🌡️ *¿Por qué construir una bodega bajo tierra?*

    Antes de existir sistemas artificiales de refrigeración, el subsuelo proporcionaba algo esencial: estabilidad.

    A varios metros de profundidad la temperatura varía mucho menos entre el invierno y el verano y la humedad se mantiene relativamente constante. Esas condiciones resultaban ideales para la fermentación y conservación del vino.

    ⛏️ *Una arquitectura excavada*

    Las bodegas no son simples cuevas naturales. Son auténticas construcciones realizadas mediante la excavación de naves, galerías, escaleras, nichos y conductos.

    Los constructores aprovecharon las características geológicas del terreno. Se retiraban las capas más fáciles de excavar dejando por encima materiales más compactos capaces de funcionar como bóveda natural.

    💨 *Las zarceras*

    Si observáis con atención algunas calles del casco antiguo podéis encontrar estructuras que recuerdan a pequeñas chimeneas.

    Son las *zarceras*, conductos verticales que comunican las bodegas con el exterior. Su función era fundamental: renovar el aire y ayudar a regular las condiciones interiores.

    Junto a ellas existían otros elementos destinados al drenaje, ventilación y conservación.

    🍇 *Del lagar a la bodega*

    La elaboración tradicional comenzaba con la vendimia. La uva se llevaba a los lagares, donde era pisada o prensada para extraer el mosto.

    Después comenzaba la fermentación y el vino era trasladado a recipientes almacenados en las bodegas subterráneas.

    Durante siglos, buena parte de la economía local estuvo estrechamente relacionada con este ciclo.

    🚪 *Una red bajo las casas*

    Muchas bodegas pertenecían a propietarios diferentes y algunas galerías estaban comunicadas entre sí. Eso generó auténticos caminos subterráneos y derechos de paso entre bodegas vecinas.

    La ciudad tenía, de hecho, dos niveles: la Aranda visible de casas, plazas e iglesias, y otra Aranda productiva varios metros bajo sus calles.

    🏺 *Patrimonio vivo*

    El conjunto de bodegas históricas está protegido como patrimonio cultural. Muchas siguen siendo privadas y varias son utilizadas por peñas y asociaciones; otras pueden visitarse.

    La Bodega de las Ánimas es uno de los espacios que permite conocer directamente este mundo subterráneo.

    Si tenéis tiempo durante vuestra estancia, entrar en una bodega histórica es uno de los mejores complementos posibles a esta ruta.

    Cuando salgáis de Aranda recordaréis sus iglesias y plazas, pero quizá lo más sorprendente sea pensar que durante buena parte del recorrido habéis caminado sobre otra ciudad.
