    🏰 *PALACIO DE LOS BERDUGO*

    El Palacio de los Berdugo es uno de los mejores ejemplos conservados de arquitectura civil histórica de Aranda.

    Fue levantado a finales del siglo XV y representa un tipo de residencia muy diferente de las viviendas ordinarias de la época. Aquí la arquitectura no solo debía resultar práctica: también debía comunicar poder, riqueza y posición social.

    🪨 *Una fachada para ser vista*

    La sólida fachada de sillería y la gran portada convertían la vivienda en una declaración pública.

    Los escudos de las familias propietarias permitían identificar a quienes controlaban la casa y recordaban a cualquiera que pasara por delante la importancia de sus habitantes.

    En distintos momentos aparecen vinculados al edificio apellidos como Durango, Tamayo, Mansilla y Berdugo.

    🏛️ *El patio interior*

    Como muchas casas nobles castellanas, la organización de la residencia gira alrededor de un patio.

    El del Palacio de los Berdugo dispone de galerías y elementos de madera y conserva un pozo en su espacio central. Era una solución que proporcionaba iluminación y ventilación a las distintas dependencias y, al mismo tiempo, generaba una zona representativa dentro de la residencia.

    👑 *Reyes, nobles y viajeros*

    Aranda fue durante siglos un punto importante en los desplazamientos entre Madrid y el norte de la península.

    La presencia de la corte y de personajes destacados hacía necesarias residencias capaces de alojar a huéspedes de alto rango.

    Uno de los episodios más conocidos asociados a este palacio se produjo en *1808*, durante la Guerra de la Independencia.

    ⚔️ *Napoleón en Aranda*

    Napoleón Bonaparte pasó por Aranda durante la campaña militar francesa en España y la tradición histórica local sitúa su alojamiento en este palacio.

    La anécdota permite imaginar por un momento algo difícil de percibir hoy: estas calles formaban parte de grandes itinerarios políticos y militares europeos.

    👀 *Una comparación interesante*

    Mirad de nuevo la fachada.

    Santa María utilizaba esculturas religiosas, monarquía y un espectacular programa decorativo para comunicar prestigio colectivo.

    Aquí el lenguaje es mucho más sobrio: piedra, escudos y proporción.

    Dos edificios muy distintos que sirven para contar dos formas diferentes de poder en la antigua Aranda.
