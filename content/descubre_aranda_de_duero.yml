    🌉 *PUENTE DE LAS TENERÍAS Y RÍO BAÑUELOS*

    El Puente de las Tenerías cruza el Bañuelos y conserva la memoria de una Aranda menos monumental pero igual de importante: la de los oficios, el agua y la vida cotidiana.

    🌊 *Una ciudad entre ríos*

    Aranda se encuentra estrechamente vinculada a varios cursos de agua.

    El Duero es el más importante, pero dentro del espacio urbano también encontramos el Arandilla y el Bañuelos.

    Durante siglos estos ríos condicionaron dónde se construía, cómo se entraba a la villa, dónde se instalaban determinadas actividades y cómo se transportaban personas y mercancías.

    🧱 *Un puente medieval*

    El puente es de origen medieval y permitía salvar el Bañuelos en una zona próxima al antiguo recinto urbano.

    Su escala es muy distinta a la del Puente Mayor sobre el Duero, pero precisamente por eso ayuda a comprender cómo se articulaban los caminos locales alrededor de la villa.

    👞 *¿Qué eran las tenerías?*

    El nombre del puente conserva el recuerdo de un antiguo oficio.

    Una *tenería* era un lugar destinado al curtido de pieles para transformarlas en cuero.

    El proceso requería mucha agua: las pieles tenían que limpiarse, remojarse y tratarse con distintos productos antes de poder utilizarse para fabricar calzado, correas, recipientes, prendas y numerosos objetos cotidianos.

    Por esa razón las tenerías solían instalarse cerca de ríos y cursos de agua.

    👃 *Un oficio alejado del centro*

    Además del agua, el curtido generaba residuos y olores muy intensos.

    Eso explica por qué este tipo de talleres aparecía con frecuencia en zonas periféricas de las ciudades medievales, cerca del agua pero lejos de los principales espacios residenciales.

    🏙️ *Mirad hacia San Juan*

    Desde este entorno podéis contemplar San Juan desde una perspectiva distinta.

    Hace solo unos minutos estabais observando su portada.

    Ahora podéis verla integrada en el paisaje, junto al río y en relación con la antigua periferia de la villa.

    🌊 *Nos falta el río principal*

    Ya hemos encontrado el Bañuelos.

    Nuestra última localización está relacionada con el curso de agua que terminó incorporándose al propio nombre de la ciudad: el Duero.

    Reunid los fragmentos obtenidos durante el recorrido. Las coordenadas os llevarán hasta el cierre de la visita.
